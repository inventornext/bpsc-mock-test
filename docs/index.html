<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BPSC Mock Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="on">
      <span class="brand-badge" id="badge">BPSC</span>
      <h1 id="siteName">BPSC Mock Test</h1>
      <p class="sub" id="tagline"></p>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit">Log in</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    if (Auth.current()) location.replace("papers.html");

    document.title = `Login | ${SITE.name}`;
    document.getElementById("siteName").textContent = SITE.name;
    document.getElementById("badge").textContent = SITE.short;
    document.getElementById("tagline").textContent = SITE.tagline;

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      err.textContent = "";
      const s = await Auth.login(
        document.getElementById("username").value,
        document.getElementById("password").value
      );
      if (s) location.href = "papers.html";
      else err.textContent = "Wrong username or password.";
    });
  </script>
</body>
</html>
