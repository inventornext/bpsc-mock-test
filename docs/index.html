<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BPSC Mock Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <span class="brand-badge" id="badge">BPSC</span>
      <h1 id="siteName">BPSC Mock Test</h1>
      <p class="sub" id="tagline"></p>

      <div class="tabs" id="tabs">
        <button class="tab active" data-t="login">Log in</button>
        <button class="tab" data-t="signup" id="signupTab">Sign up</button>
      </div>

      <!-- login -->
      <form id="loginForm">
        <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" required autocomplete="email"></div>
        <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary" type="submit">Log in</button>
        <p class="small-link"><a href="#" id="forgotLink">Forgot password?</a></p>
      </form>

      <!-- signup -->
      <form id="signupForm" class="hidden">
        <div class="field"><label for="sName">Full name</label><input id="sName" required maxlength="80" autocomplete="name"></div>
        <div class="field"><label for="sEmail">Email</label><input id="sEmail" type="email" required autocomplete="email"></div>
        <div class="field"><label for="sPass">Password (min 6 characters)</label><input id="sPass" type="password" required minlength="6" autocomplete="new-password"></div>
        <button class="btn btn-primary" type="submit">Create account</button>
      </form>

      <!-- reset -->
      <form id="resetForm" class="hidden">
        <p class="sub" style="margin-bottom:14px">Enter your email and we'll send a link to set a new password.</p>
        <div class="field"><label for="rEmail">Email</label><input id="rEmail" type="email" required autocomplete="email"></div>
        <button class="btn btn-primary" type="submit">Send reset link</button>
        <p class="small-link"><a href="#" id="backLink">Back to log in</a></p>
      </form>

      <div class="error" id="msg"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script type="module">
    import { configured, currentUser, login, signup, resetPassword, friendlyError, ALLOW_SIGNUP } from "./js/fb.js";

    document.title = `Login | ${SITE.name}`;
    document.getElementById("siteName").textContent = SITE.name;
    document.getElementById("badge").textContent = SITE.short;
    document.getElementById("tagline").textContent = SITE.tagline;

    const msg = document.getElementById("msg");
    const forms = { login: loginForm, signup: signupForm, reset: resetForm };
    const say = (text, ok = false) => { msg.textContent = text; msg.style.color = ok ? "var(--green)" : ""; };

    if (!configured) {
      say("Firebase isn't set up yet. Paste your config into docs/js/firebase-config.js (see README).");
      document.querySelectorAll("button").forEach((b) => (b.disabled = true));
    } else if (await currentUser()) {
      location.replace("papers.html");
    }

    if (!ALLOW_SIGNUP) { signupTab.remove(); }

    function show(name) {
      Object.entries(forms).forEach(([k, f]) => f.classList.toggle("hidden", k !== name));
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.t === name));
      tabs.classList.toggle("hidden", name === "reset");
      say("");
    }
    tabs.onclick = (e) => { const t = e.target.closest(".tab"); if (t) show(t.dataset.t); };
    forgotLink.onclick = (e) => { e.preventDefault(); rEmail.value = lEmail.value; show("reset"); };
    backLink.onclick = (e) => { e.preventDefault(); show("login"); };

    async function run(form, fn) {
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true; say("");
      try { await fn(); }
      catch (err) { say(friendlyError(err)); }
      finally { btn.disabled = false; }
    }

    loginForm.onsubmit = (e) => { e.preventDefault(); run(loginForm, async () => {
      await login(lEmail.value, lPass.value);
      location.href = "papers.html";
    }); };

    signupForm.onsubmit = (e) => { e.preventDefault(); run(signupForm, async () => {
      await signup(sName.value.trim(), sEmail.value, sPass.value);
      location.href = "papers.html";
    }); };

    resetForm.onsubmit = (e) => { e.preventDefault(); run(resetForm, async () => {
      await resetPassword(rEmail.value);
      say("Reset link sent. Check your inbox (and spam folder).", true);
    }); };
  </script>
</body>
</html>
