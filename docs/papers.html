<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papers | BPSC Mock Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <h1 class="page-title" id="hello">Papers</h1>
    <p class="page-sub">Pick a paper to start a timed test. Your answers save online as you go, so you can resume on any device.</p>

    <div id="unlockBanner"></div>

    <div class="paper-grid" id="papers"><div class="empty">Loading papers...</div></div>

    <h2 class="section-title">Your attempts</h2>
    <div id="history"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script type="module">
    import { requireUser, logout, myAttempts, listProgress, getPaperIndex, getMyPayment, friendlyError } from "./js/fb.js";

    const user = await requireUser();
    renderTopbar(user, logout);
    document.title = `Papers | ${SITE.name}`;
    document.getElementById("hello").textContent = `Welcome, ${user.name}`;

    const box = document.getElementById("papers");
    const hist = document.getElementById("history");
    let papers, attempts, progress, payment = null;
    try {
      [papers, attempts, progress, payment] = await Promise.all([
        getPaperIndex(), myAttempts(user.uid), listProgress(user.uid),
        user.hasAccess ? null : getMyPayment(user.uid).catch(() => null),
      ]);
    } catch (e) {
      showFatal(box, "Could not load: " + friendlyError(e));
      hist.innerHTML = "";
      throw e;
    }

    // unlock banner for students who haven't paid
    const lockedCount = papers.filter((p) => !p.free).length;
    if (!user.hasAccess && lockedCount) {
      const st = payment && payment.status;
      document.getElementById("unlockBanner").innerHTML = `
        <div class="unlock-banner ${st === "pending" ? "pending" : ""}">
          <div>
            ${st === "pending"
              ? `<b>Payment received, waiting for approval.</b><span>We'll unlock all papers soon. You can keep using the free papers meanwhile.</span>`
              : st === "rejected"
              ? `<b>We couldn't confirm your payment.</b><span>Check the payment reference and send it again.</span>`
              : `<b>Unlock all ${papers.length} papers for &#8377;${PAYMENT.price}</b><span>One-time payment, lifetime access. ${papers.length - lockedCount ? `${papers.length - lockedCount} free paper${papers.length - lockedCount > 1 ? "s" : ""} to try first.` : ""}</span>`}
          </div>
          <a class="btn ${st === "pending" ? "" : "btn-primary"}" href="buy.html">${st === "pending" ? "View status" : st === "rejected" ? "Send again" : "Unlock now"}</a>
        </div>`;
    }

    if (!papers.length) {
      box.innerHTML = `<div class="empty">No papers yet.</div>`;
    } else {
      box.innerHTML = papers.map((p) => {
        const mine = attempts.filter((a) => a.paperId === p.id);
        const best = mine.length ? Math.max(...mine.map((a) => a.score)) : null;
        const prog = progress[p.id];
        const inProgress = prog && prog.endsAt > Date.now();
        const locked = !p.free && !user.hasAccess;
        return `
          <div class="paper-card${locked ? " locked" : ""}">
            <div style="display:flex; gap:6px; align-items:center">
              <span class="year">${esc(p.year ?? "")}</span>
              ${p.free ? `<span class="free-tag">Free</span>` : locked ? `<span class="lock-tag">&#128274; Locked</span>` : ""}
            </div>
            <h3>${esc(p.title)}</h3>
            <div class="paper-meta">
              <span>${p.count} questions</span>
              <span>${p.duration} min</span>
              <span>+${fmtNum(p.marks)}${p.negative ? ` / -${fmtNum(p.negative)}` : ", no negative"}</span>
            </div>
            ${inProgress ? `<span class="resume-tag">In progress, ${fmtClock((prog.endsAt - Date.now()) / 1000)} left</span>` : ""}
            <div class="best">${best !== null ? `Best: <b>${fmtNum(best)}</b> / ${fmtNum(p.count * p.marks)} (${mine.length} attempt${mine.length > 1 ? "s" : ""})` : `<span style="color:var(--muted)">Not attempted yet</span>`}</div>
            <div class="actions">
              ${locked
                ? `<a class="btn" href="buy.html">Unlock &#8377;${PAYMENT.price}</a>`
                : `<a class="btn btn-primary" href="exam.html?paper=${encodeURIComponent(p.id)}">${inProgress ? "Resume" : "Start test"}</a>`}
            </div>
          </div>`;
      }).join("");
    }

    if (!attempts.length) {
      hist.innerHTML = `<div class="empty">No attempts yet. Finish a test and your results show up here, on any device you log in from.</div>`;
    } else {
      const rows = attempts.map((a) => `
        <tr>
          <td>${esc(a.title)}</td>
          <td>${fmtDate(a.submittedAt)}</td>
          <td><b>${fmtNum(a.score)}</b> / ${fmtNum(a.max)}</td>
          <td>${a.correct} / ${a.wrong} / ${a.skipped}</td>
          <td>${fmtDuration(a.timeTaken)}</td>
          <td><a href="result.html?attempt=${encodeURIComponent(a.id)}">View</a></td>
        </tr>`).join("");
      hist.innerHTML = `
        <div style="overflow-x:auto"><table class="history">
          <thead><tr><th>Paper</th><th>Date</th><th>Score</th><th>Right / Wrong / Skipped</th><th>Time</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }
  </script>
</body>
</html>
