<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papers | BPSC Mock Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <div class="crumbs hidden" id="crumbs"><a href="papers.html">All exams</a></div>
    <h1 class="page-title" id="hello">Papers</h1>
    <p class="page-sub" id="pageSub">Pick an exam, then a paper. Your answers save online as you go, so you can resume on any device.</p>

    <div id="unlockBanner"></div>
    <div id="liveStrip"></div>

    <!-- exam picker (no exam chosen) -->
    <div id="examView" class="hidden">
      <div class="booklet-grid" id="examGrid"></div>
    </div>

    <!-- papers of one exam -->
    <div id="paperView" class="hidden">
    <div class="tabs paper-tabs hidden" id="paperTabs">
      <button class="tab active" data-cat="pyq">Previous year papers</button>
      <button class="tab" data-cat="mock">Mock tests</button>
    </div>
    <div class="paper-grid" id="papers"><div class="empty">Loading papers...</div></div>
    </div>

    <h2 class="section-title">Your attempts</h2>
    <div id="history"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script type="module">
    import { requireUser, logout, myAttempts, listProgress, getPaperIndex, getMyPayment, getExams, friendlyError } from "./js/fb.js";

    const user = await requireUser();
    renderTopbar(user, logout);
    document.title = `Papers | ${SITE.name}`;
    document.getElementById("hello").textContent = `Welcome, ${user.name}`;

    const box = document.getElementById("papers");
    const hist = document.getElementById("history");
    let papers, attempts, progress, payment = null, exams;
    try {
      [papers, attempts, progress, payment, exams] = await Promise.all([
        getPaperIndex(), myAttempts(user.uid), listProgress(user.uid),
        user.hasAccess ? null : getMyPayment(user.uid).catch(() => null),
        getExams(),
      ]);
    } catch (e) {
      showFatal(box, "Could not load: " + friendlyError(e));
      hist.innerHTML = "";
      throw e;
    }

    // unlock / renew banner
    const lockedCount = papers.filter((p) => !p.free).length;
    const banner = document.getElementById("unlockBanner");
    const freeCount = papers.length - lockedCount;
    if (!user.hasAccess && lockedCount) {
      const st = payment && payment.status;
      let head, sub, btn, cls = "";
      if (st === "pending") {
        cls = "pending"; btn = "View status";
        head = "Payment received, waiting for approval.";
        sub = "We'll unlock all papers soon. You can keep using the free papers meanwhile.";
      } else if (st === "rejected") {
        btn = "Send again"; head = "We couldn't confirm your payment.";
        sub = "Check the payment reference and send it again.";
      } else if (user.accessExpiredAt) {
        btn = "Renew now"; head = `Your access ended on ${fmtDay(user.accessExpiredAt)}.`;
        sub = `Renew for &#8377;${PAYMENT.price} to unlock all ${papers.length} papers for another ${planLabel()}.`;
      } else {
        btn = "Unlock now"; head = `Unlock all ${papers.length} papers for &#8377;${PAYMENT.price}`;
        sub = `${planLabel()} access from the day of payment.${freeCount ? ` ${freeCount} free paper${freeCount > 1 ? "s" : ""} to try first.` : ""}`;
      }
      banner.innerHTML = `
        <div class="unlock-banner ${cls}">
          <div><b>${head}</b><span>${sub}</span></div>
          <a class="btn ${cls ? "" : "btn-primary"}" href="buy.html">${btn}</a>
        </div>`;
    } else if (user.hasAccess && !user.isAdmin && user.accessExpiresAt && daysLeft(user.accessExpiresAt) <= 15) {
      banner.innerHTML = `
        <div class="unlock-banner">
          <div><b>Your access ends in ${daysLeft(user.accessExpiresAt)} day${daysLeft(user.accessExpiresAt) === 1 ? "" : "s"} (${fmtDay(user.accessExpiresAt)}).</b>
          <span>Renew now and the new ${planLabel()} is added on top, so you don't lose any days.</span></div>
          <a class="btn btn-primary" href="buy.html">Renew</a>
        </div>`;
    }

    // ---- which exam? ----
    papers.forEach((p) => (p.exam = p.exam || "cce"));

    // ---- live and upcoming scheduled tests (all exams) ----
    const liveList = papers.filter((p) => ["live", "upcoming"].includes(liveState(p)))
      .sort((a, b) => a.liveStart - b.liveStart);
    if (liveList.length) {
      document.getElementById("liveStrip").innerHTML = `
        <h2 class="section-title" style="margin-top:6px">Live tests</h2>
        <div class="live-list">${liveList.map((p) => {
          const st = liveState(p), locked = !p.free && !user.hasAccess;
          const when = st === "live"
            ? `<span class="live-badge">&#9679; LIVE NOW</span> ${p.liveEnd ? `Ends ${fmtWhen(p.liveEnd)} &middot; <span data-cd="${p.liveEnd}">${fmtCountdown(p.liveEnd - Date.now())}</span> left` : ""}`
            : `<span class="soon-badge">Upcoming</span> Starts ${fmtWhen(p.liveStart)} &middot; in <span data-cd="${p.liveStart}">${fmtCountdown(p.liveStart - Date.now())}</span>`;
          const btn = st === "upcoming" ? `<button class="btn" disabled>Opens at start time</button>`
            : locked ? `<a class="btn" href="buy.html">Unlock &#8377;${PAYMENT.price}</a>`
            : `<a class="btn btn-primary" href="exam.html?paper=${encodeURIComponent(p.id)}">Start now</a>`;
          return `<div class="live-item"><div><b>${esc(p.title)}</b><div class="live-when">${when}</div>
            <div class="live-when">${p.count} questions &middot; ${p.duration} min${p.liveEnd ? " &middot; start before the end time to be ranked" : ""}</div></div>${btn}</div>`;
        }).join("")}</div>`;
    }

    const examsWithPapers = exams.filter((e) => papers.some((p) => p.exam === e.id));
    let examId = qs("exam");
    if (!examId && examsWithPapers.length === 1 && exams.length === 1) examId = examsWithPapers[0].id;
    const exam = exams.find((e) => e.id === examId);
    if (!exam) {
      // exam picker
      document.getElementById("examView").classList.remove("hidden");
      document.getElementById("examGrid").innerHTML = examGridHTML(exams, papers, (e) => `papers.html?exam=${encodeURIComponent(e.id)}`);
    } else {
      document.getElementById("paperView").classList.remove("hidden");
      document.getElementById("crumbs").classList.remove("hidden");
      document.getElementById("hello").textContent = `${exam.short}: ${exam.name}`;
      document.getElementById("hello").style.color = exam.color;
      document.getElementById("pageSub").textContent = exam.about || "Pick a paper to start a timed test.";
      document.title = `${exam.short} papers | ${SITE.name}`;
      papers = papers.filter((p) => p.exam === exam.id);
    }

    // ---- tabs: previous year papers / mock tests ----
    papers.forEach((p) => (p.category = p.category === "mock" ? "mock" : "pyq"));
    const counts = { pyq: papers.filter((p) => p.category === "pyq").length, mock: papers.filter((p) => p.category === "mock").length };
    const tabs = document.getElementById("paperTabs");
    let cat = Store.get("bpsc_papers_tab", "pyq");
    if (!counts[cat]) cat = counts.pyq ? "pyq" : "mock";
    if (counts.pyq || counts.mock) {
      tabs.classList.remove("hidden");
      tabs.querySelector('[data-cat="pyq"]').textContent = `Previous year papers (${counts.pyq})`;
      tabs.querySelector('[data-cat="mock"]').textContent = `Mock tests (${counts.mock})`;
    }
    tabs.onclick = (e) => {
      const b = e.target.closest(".tab"); if (!b) return;
      cat = b.dataset.cat; Store.set("bpsc_papers_tab", cat); drawPapers();
    };

    function drawPapers() {
    tabs.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.cat === cat));
    const shown = sortPapers(papers.filter((p) => p.category === cat));
    if (!shown.length) {
      box.innerHTML = `<div class="empty">No papers yet.</div>`;
    } else {
      box.innerHTML = shown.map((p) => {
        const mine = attempts.filter((a) => a.paperId === p.id);
        const best = mine.length ? Math.max(...mine.map((a) => a.score)) : null;
        const prog = progress[p.id];
        const inProgress = prog && prog.endsAt > Date.now();
        const locked = !p.free && !user.hasAccess;
        const st = liveState(p);
        return `
          <div class="paper-card${locked ? " locked" : ""}">
            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap">
              ${p.category === "mock" ? `<span class="year">Mock</span>` : `<span class="year">${esc(p.year ?? "")}</span>`}
              ${p.free ? `<span class="free-tag">Free</span>` : locked ? `<span class="lock-tag">&#128274; Locked</span>` : ""}
              ${st === "live" ? `<span class="live-badge">&#9679; LIVE</span>` : st === "upcoming" ? `<span class="soon-badge">Starts ${fmtWhen(p.liveStart)}</span>` : ""}
            </div>
            <h3>${esc(p.title)}</h3>
            <div class="paper-meta">
              <span>${p.count} questions</span>
              <span>${p.duration} min</span>
              <span>+${fmtNum(p.marks)}${p.negative ? ` / -${fmtNum(p.negative)}` : ", no negative"}</span>
            </div>
            ${inProgress ? `<span class="resume-tag">In progress, ${fmtClock((prog.endsAt - Date.now()) / 1000)} left</span>` : ""}
            <div class="best">${best !== null ? `Best: <b>${fmtNum(best)}</b> / ${fmtNum(p.count * p.marks)} (${mine.length} attempt${mine.length > 1 ? "s" : ""})` : `<span style="color:var(--muted)">Not attempted yet</span>`}</div>
            <div class="actions">
              ${st === "upcoming" && !user.isAdmin
                ? `<button class="btn" disabled>Opens in <span data-cd="${p.liveStart}">${fmtCountdown(p.liveStart - Date.now())}</span></button>`
                : locked
                ? `<a class="btn" href="buy.html">Unlock &#8377;${PAYMENT.price}</a>`
                : `<a class="btn btn-primary" href="exam.html?paper=${encodeURIComponent(p.id)}">${inProgress ? "Resume" : "Start test"}</a>`}
              <a class="btn" href="leaderboard.html?paper=${encodeURIComponent(p.id)}" title="Top 10" style="flex:0 0 auto">&#127942; Toppers</a>
            </div>
          </div>`;
      }).join("");
    }
    }
    drawPapers();
    startCountdowns();

    if (!attempts.length) {
      hist.innerHTML = `<div class="empty">No attempts yet. Finish a test and your results show up here, on any device you log in from.</div>`;
    } else {
      const rows = attempts.map((a) => `
        <tr>
          <td>${esc(a.title)}</td>
          <td>${fmtDate(a.submittedAt)}</td>
          <td><b>${fmtNum(a.score)}</b> / ${fmtNum(a.max)}</td>
          <td>${a.correct} / ${a.wrong} / ${a.skipped}</td>
          <td>${fmtDuration(a.timeTaken)}</td>
          <td><a href="result.html?attempt=${encodeURIComponent(a.id)}">View</a></td>
        </tr>`).join("");
      hist.innerHTML = `
        <div style="overflow-x:auto"><table class="history">
          <thead><tr><th>Paper</th><th>Date</th><th>Score</th><th>Right / Wrong / Skipped</th><th>Time</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }
  </script>
</body>
</html>
