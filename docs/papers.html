<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests | BPSC Mock Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container dash">
    <nav class="exam-switch" id="examSwitch" aria-label="Exams"></nav>

    <section class="exam-head">
      <div>
        <h1 id="examName">Tests</h1>
        <p id="examAbout">Loading your tests...</p>
      </div>
      <div id="access"></div>
    </section>

    <div class="dash-tabs" id="tabs" role="tablist"></div>
    <div id="list"><div class="loading">Loading tests...</div></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script type="module">
    import { requireUser, logout, myAttempts, listProgress, getPaperIndex, getMyPayment, getExams, friendlyError } from "./js/fb.js";

    const user = await requireUser();
    renderTopbar(user, logout);
    document.title = `Tests | ${SITE.name}`;
    const $ = (id) => document.getElementById(id);

    let papers, attempts, progress, payment = null, exams;
    try {
      [papers, attempts, progress, payment, exams] = await Promise.all([
        getPaperIndex(), myAttempts(user.uid), listProgress(user.uid),
        user.hasAccess ? null : getMyPayment(user.uid).catch(() => null),
        getExams(),
      ]);
    } catch (e) {
      showFatal($("list"), "Could not load your tests: " + friendlyError(e));
      throw e;
    }
    papers.forEach((p) => {
      p.exam = p.exam || "cce";
      p.category = p.category === "mock" ? "mock" : "pyq";
      p.title = String(p.title).replace(/\s*\((Hindi \+ English|हिंदी\s*\/?\s*English)\)\s*/gi, " ").trim();
    });
    const freeTotal = papers.filter((p) => p.free).length;

    /* ---------- which exam ---------- */
    const count = (id) => papers.filter((p) => p.exam === id).length;
    const hasLive = (id) => papers.some((p) => p.exam === id && ["live", "upcoming"].includes(liveState(p)));
    let examId = qs("exam") || Store.get("bpsc_exam", null);
    if (!exams.some((e) => e.id === examId && count(e.id))) examId = (exams.find((e) => count(e.id)) || exams[0] || {}).id;

    function drawSwitch() {
      $("examSwitch").innerHTML = exams.map((e) => count(e.id)
        ? `<a class="exam-pill${e.id === examId ? " on" : ""}" href="papers.html?exam=${encodeURIComponent(e.id)}" data-exam="${esc(e.id)}"
             ${e.id === examId ? 'aria-current="page"' : ""}><b>${esc(e.short)}</b><span>${count(e.id)} test${count(e.id) > 1 ? "s" : ""}</span>${hasLive(e.id) ? '<i class="live-dot" title="Live test"></i>' : ""}</a>`
        : `<span class="exam-pill soon" title="Tests coming soon"><b>${esc(e.short)}</b><span>Soon</span></span>`).join("");
    }
    $("examSwitch").onclick = (e) => {
      const a = e.target.closest("[data-exam]"); if (!a) return;
      e.preventDefault();
      examId = a.dataset.exam; tab = "all";
      history.replaceState(null, "", `papers.html?exam=${encodeURIComponent(examId)}`);
      draw();
    };

    /* ---------- access line ---------- */
    function drawAccess() {
      const el = $("access");
      const st = payment && payment.status;
      if (user.isAdmin) { el.innerHTML = `<div class="access">Admin: every test is open to you.</div>`; return; }
      if (user.hasAccess) {
        const left = user.accessExpiresAt ? daysLeft(user.accessExpiresAt) : null;
        el.innerHTML = left !== null && left <= 15
          ? `<div class="access warn"><span><b>Access ends in ${left} day${left === 1 ? "" : "s"}.</b> Renew now and the new period is added on top.</span><a class="btn btn-primary" href="buy.html">Renew</a></div>`
          : `<div class="access">Full access${user.accessExpiresAt ? ` until <b>${fmtDay(user.accessExpiresAt)}</b>` : ""}.</div>`;
        return;
      }
      if (st === "pending") {
        el.innerHTML = `<div class="access wait"><span><b>Payment sent.</b> All tests unlock once it's approved. Free tests are open meanwhile.</span><a class="btn" href="buy.html">View status</a></div>`;
      } else if (st === "rejected") {
        el.innerHTML = `<div class="access warn"><span><b>Payment not confirmed.</b> Check the reference number and send it again.</span><a class="btn btn-primary" href="buy.html">Send again</a></div>`;
      } else if (user.accessExpiredAt) {
        el.innerHTML = `<div class="access warn"><span><b>Your access ended on ${fmtDay(user.accessExpiredAt)}.</b> Free tests are still open.</span><a class="btn btn-primary" href="buy.html">Renew &#8377;${PAYMENT.price}</a></div>`;
      } else {
        el.innerHTML = `<div class="access"><span><b>${freeTotal} free test${freeTotal === 1 ? "" : "s"}</b> to try. Unlock all ${papers.length} for &#8377;${PAYMENT.price} for ${planLabel()}.</span><a class="btn btn-primary" href="buy.html">Unlock all</a></div>`;
      }
    }

    /* ---------- one test row ---------- */
    const LOCK = `<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 7V5a4 4 0 1 1 8 0v2h.5A1.5 1.5 0 0 1 14 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-5A1.5 1.5 0 0 1 3.5 7H4Zm2 0h4V5a2 2 0 1 0-4 0v2Z"/></svg>`;
    function row(p) {
      const mine = attempts.filter((a) => a.paperId === p.id);
      const max = p.count * p.marks;
      const best = mine.length ? Math.max(...mine.map((a) => a.score)) : null;
      const prog = progress[p.id];
      const inProgress = prog && prog.endsAt > Date.now();
      const locked = !p.free && !user.hasAccess;
      const st = liveState(p);
      const upcoming = st === "upcoming" && !user.isAdmin && !locked;
      const href = `exam.html?paper=${encodeURIComponent(p.id)}`;

      let bubble = `<div class="bubble" aria-hidden="true"></div>`;
      if (locked) bubble = `<div class="bubble locked" aria-hidden="true">${LOCK}</div>`;
      else if (st === "live") bubble = `<div class="bubble live" aria-hidden="true"></div>`;
      else if (upcoming) bubble = `<div class="bubble soon" aria-hidden="true"></div>`;
      else if (inProgress) bubble = `<div class="bubble half" aria-hidden="true"></div>`;
      else if (best !== null) bubble = `<div class="bubble done" aria-hidden="true">${Math.max(0, Math.round(best / max * 100))}%</div>`;

      let status = "";
      if (st === "live") status = `<div class="tr-status live">Live now${p.liveEnd ? `. Ends ${fmtWhen(p.liveEnd)}, start before then to be ranked.` : "."}</div>`;
      else if (st === "upcoming") status = `<div class="tr-status">Starts ${fmtWhen(p.liveStart)}${p.liveEnd ? `, ends ${fmtWhen(p.liveEnd)}` : ""}.</div>`;
      else if (inProgress) status = `<div class="tr-status">In progress, ${fmtClock((prog.endsAt - Date.now()) / 1000)} left on the timer.</div>`;
      else if (best !== null) status = `<div class="tr-status">Best score <b>${fmtNum(best)}</b> of ${fmtNum(max)} in ${mine.length} attempt${mine.length > 1 ? "s" : ""}.</div>`;
      else if (locked) status = `<div class="tr-status">Unlock to take this test.</div>`;

      const tags = [
        st === "live" ? `<span class="tag live">Live</span>` : "",
        st === "upcoming" ? `<span class="tag soon">Upcoming</span>` : "",
        p.free && !user.hasAccess ? `<span class="tag free">Free</span>` : "",
        p.hindi ? `<span class="tag lang">हिंदी + English</span>` : "",
      ].join("");

      const action = upcoming
        ? `<button class="btn" disabled>Opens in <span data-cd="${p.liveStart}">${fmtCountdown(p.liveStart - Date.now())}</span></button>`
        : locked ? `<a class="btn" href="buy.html">Unlock</a>`
        : inProgress ? `<a class="btn btn-primary" href="${href}">Resume</a>`
        : best !== null ? `<a class="btn" href="${href}">Retake</a>`
        : `<a class="btn btn-primary" href="${href}">Start test</a>`;

      return `
        <article class="test-row${locked ? " locked" : ""}">
          ${bubble}
          <div>
            <h3>${esc(p.title)}${tags ? `<span class="tr-tags">${tags}</span>` : ""}</h3>
            <div class="tr-meta"><span>${p.count} questions</span><span>${p.duration} min</span><span>${fmtNum(max)} marks</span><span>${p.negative ? `-${fmtNum(p.negative)} per wrong answer` : "No negative marking"}</span></div>
            ${status}
          </div>
          <div class="tr-actions">${action}<a class="icon-btn" href="leaderboard.html?paper=${encodeURIComponent(p.id)}" title="Toppers for this test" aria-label="Toppers for ${esc(p.title)}">&#127942;</a></div>
        </article>`;
    }
    const group = (title, note, list) => list.length
      ? `<h2 class="group-title">${title}${note ? `<small>${note}</small>` : ""}</h2><div class="test-list">${list.map(row).join("")}</div>` : "";

    /* ---------- tabs and lists ---------- */
    let tab = "all";
    const freeFirst = (list) => user.hasAccess ? list : [...list].sort((a, b) => (b.free ? 1 : 0) - (a.free ? 1 : 0));
    const isLiveish = (p) => ["live", "upcoming"].includes(liveState(p));

    function draw() {
      Store.set("bpsc_exam", examId);
      const exam = exams.find((e) => e.id === examId) || { short: "Tests", name: "Tests", about: "" };
      document.title = `${exam.short} tests | ${SITE.name}`;
      $("examName").textContent = exam.name;
      $("examAbout").textContent = exam.about || "";
      drawSwitch();
      drawAccess();

      const mine = papers.filter((p) => p.exam === examId);
      const live = mine.filter(isLiveish).sort((a, b) => a.liveStart - b.liveStart);
      const pastLive = mine.filter((p) => liveState(p) === "ended").sort((a, b) => b.liveStart - a.liveStart);
      const pyq = sortPapers(mine.filter((p) => p.category === "pyq"));
      const mock = sortPapers(mine.filter((p) => p.category === "mock"));
      const tabs = [
        ["all", "All tests", mine.length],
        ["live", "Live", live.length + pastLive.length],
        ["pyq", "Previous year papers", pyq.length],
        ["mock", "Mock tests", mock.length],
      ].filter(([id, , n]) => id === "all" || n);
      if (!tabs.some(([id]) => id === tab)) tab = "all";
      $("tabs").innerHTML = tabs.map(([id, label, n]) =>
        `<button class="dash-tab${id === tab ? " on" : ""}${id === "live" && live.length ? " live-tab" : ""}" role="tab" aria-selected="${id === tab}" data-tab="${id}">${label}<span class="n">${id === "live" && live.length ? live.length : n}</span></button>`).join("");

      let html = "";
      if (!mine.length) {
        html = `<div class="dash-empty"><b>No tests for ${esc(exam.short)} yet.</b>New papers are added regularly.</div>`;
      } else if (tab === "all") {
        const rest = mine.filter((p) => !isLiveish(p));
        const free = user.hasAccess ? [] : sortPapers(rest.filter((p) => p.free));
        const notFree = (p) => user.hasAccess || !p.free;
        html = group("Live and upcoming", "Scheduled tests with a toppers list", live)
          + group("Free tests", "Open to everyone, no payment needed", free)
          + group("Previous year papers", "Newest first", pyq.filter((p) => !isLiveish(p) && notFree(p)))
          + group("Mock tests", "", mock.filter((p) => !isLiveish(p) && notFree(p)));
      } else if (tab === "live") {
        html = group("Live and upcoming", "", live) + group("Past live tests", "Open for practice; the toppers list shows the live result", pastLive);
      } else if (tab === "pyq") {
        html = `<div style="margin-top:14px"></div><div class="test-list">${freeFirst(pyq).map(row).join("")}</div>`;
      } else {
        html = `<div style="margin-top:14px"></div><div class="test-list">${freeFirst(mock).map(row).join("")}</div>`;
      }
      $("list").innerHTML = html;
    }
    $("tabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; draw(); } };

    draw();
    startCountdowns();
  </script>
</body>
</html>
